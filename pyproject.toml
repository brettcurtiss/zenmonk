[project]
name = "zenmonk"
version = "0.1.0"
description = "IT operations runbooks for the ZenMonk touch-screen kiosk application, built with Zensical."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
docs = ["zensical>=0.0.65"]
dev = ["pre-commit>=4.0"]
pdf = [
    "prodockit>=0.73.0",
    "weasyprint>=70.0",
]

[tool.uv]
package = false
default-groups = ["docs", "pdf", "dev"]
