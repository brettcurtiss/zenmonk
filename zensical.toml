[project]
site_name = "ZenMonk Kiosk Runbooks"
site_description = "Operational runbooks for the ZenMonk touch-screen kiosk application"
site_author = "ZenMonk IT Operations"
site_url = "https://brettcurtiss.github.io/zenmonk/"
copyright = "Copyright &copy; 2026 ZenMonk IT Operations &middot; Demo content"

repo_url = "https://github.com/brettcurtiss/zenmonk"
repo_name = "brettcurtiss/zenmonk"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Service overview" = [
    "overview/index.md",
    "overview/architecture.md",
    "overview/contacts.md",
  ] },
  { "Incident response" = [
    "incidents/index.md",
    "incidents/severity.md",
    "incidents/communication.md",
  ] },
  { "Runbooks" = [
    "runbooks/index.md",
    "runbooks/touch-unresponsive.md",
    "runbooks/white-screen.md",
    "runbooks/kiosk-offline.md",
    "runbooks/slow-ui.md",
    "runbooks/deploy-rollback.md",
  ] },
  { "Reference" = [
    "reference/health-checks.md",
    "reference/kioskctl.md",
    "reference/glossary.md",
  ] },
  { "Contributing" = [
    "contributing/index.md",
    "contributing/runbook-template.md",
  ] },
]

extra_css = ["assets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

[project.theme.icon]
logo = "lucide/monitor-smartphone"
repo = "fontawesome/brands/github"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/brettcurtiss/zenmonk"


[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["includes"]
pymdownx.snippets.auto_append = ["abbreviations.md"]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
